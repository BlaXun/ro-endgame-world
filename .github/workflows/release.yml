# Every push checks that the mods package; a v* tag also publishes them.
#
# A release carries one zip per mod (dist/<mod>-<version>.zip), built here
# from the tagged commit, so what players install is what the repository
# holds. The app's registry entries pick their zip by name.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the mods
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 tools/package.py --tag "$GITHUB_REF_NAME"
          else
            python3 tools/package.py
          fi
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
