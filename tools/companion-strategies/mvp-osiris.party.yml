# Osiris (OSIRIS, pre-renewal MVP, level 78, Undead 4): a boss plan. One of the
# pre-renewal MVPs the boss method learns from (BOSSES.md); kept to ship in a
# boss-plans mod later. Not shipped. Rule names are prefixed os_.
#
#   What kills: Meteor Assault, all round it at every turn in a fight (34 % of the
#   damage a level-80 party of five took without a plan), its Ancient Mummies (25 %)
#   and Isis (17 %); Stone Curse, Curse and Poison. It is Undead: holy hurts it most,
#   and the Mummies too.
#   So: nobody but the tank within its reach (Meteor Assault is melee-range); Magnus
#   Exorcismus on it whenever its slaves crowd it; Aspersio on the tank; Status
#   Recovery on the petrified.
#
# Results: see BOSSES.md.

Header:
  Type: POPULATION_STRATEGY_DB
  Version: 1

Body:
  - Mob: OSIRIS
    Encounter: true
    Jobs:
      - Job: [Priest, Wizard, Sage, Hunter]
        Rules:
          - Name: os_out_of_its_reach
            Priority: 87
            Requires: { Role: [support, attacker] }
            Target: { Enemy: boss, Mob: OSIRIS }
            KeepDistance: { Min: 4, Max: 9 }
      - Job: [Wizard, Sage, Hunter]
        Rules:
          - Name: os_into_the_clear
            Priority: 86
            MoveTo: { Sight: target, Within: 8, Range: 9 }
      - Job: Gunslinger
        Rules:
          # Desperado hits him and his slaves within 3 cells; the engine has no Gunslinger
          # rotation (NEEDS 17), so the plan casts it.
          - Name: os_beside_him
            Priority: 88
            Target: { Enemy: boss, Mob: OSIRIS }
            KeepDistance: { Min: 1, Max: 2 }
          - Name: os_desperado
            Priority: 82
            Cast: GS_DESPERADO
            Target: self
            Count: { Enemy: any, Range: 3, AtLeast: 1 }
      - Job: Priest
        Rules:
          # His Ancient Mummies did 44 % of the damage: they chase the members he does not
          # reach. Magnus where they are (Undead: pre-renewal Magnus hurts only Undead and
          # Demons), not only when they crowd him.
          - Name: os_magnus
            Priority: 89
            Cast: PR_MAGNUS
            Target: { Enemy: slaves }
            Count: { Enemy: slaves, Around: target, Range: 3, AtLeast: 2 }
            Cooldown: 4000
          # A Mummy's hit is melee: Safety Wall under whoever one is on.
          - Name: os_wall_the_hit
            Priority: 87
            Cast: MG_SAFETYWALL
            Target: { Ally: attacked }
            When: self_sp_ge120
            Field: { Skill: MG_SAFETYWALL, Owner: party, At: target, Range: 0, Below: 1 }
            Cooldown: 4000
          - Name: os_unstone
            Priority: 90
            Cast: PR_STRECOVERY
            Target: { Ally: having, Status: SC_STONE }
          # Holy on whoever hits him with a weapon: Holy does 200 % to Undead 4.
          - Name: os_aspersio
            Priority: 86
            Cast: PR_ASPERSIO
            Target: { Ally: missing, Status: SC_ASPERSIO, Role: [tank, attacker], Expiring: 3000 }
          # Meteor Assault counts as melee (range 0): Safety Wall stops it. Whoever stands
          # beside him (a tank, the Gunslinger) gets one.
          - Name: os_wall_his_reach
            Priority: 88
            Cast: MG_SAFETYWALL
            Target: { Ally: attacked, Role: [tank, attacker] }
            Count: { Enemy: boss, Mob: OSIRIS, Around: target, Range: 3, AtLeast: 1 }
            Field: { Skill: MG_SAFETYWALL, Owner: party, At: target, Range: 0, Below: 1 }
            Cooldown: 3000
