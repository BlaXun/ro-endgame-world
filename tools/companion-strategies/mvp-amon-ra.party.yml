# Amon Ra (AMON_RA, pre-renewal MVP, level 88, Earth 3): a boss plan for a party with a
# Sage or Professor. One of the pre-renewal MVPs the boss method learns from
# (tools/renewal-world-monsters/BOSSES.md); kept to ship in a boss-plans mod later.
#
# Not shipped. To use it, copy the entries into a mod's db/population_strategy.yml,
# after companion-roles and everyday-party. Rule names are prefixed ar_.
#
#   What kills: Meteor Storm (half its turns in a fight, and at once on anyone who
#   casts at it or shoots it) and Fire Pillar. Both are ground spells, so Land
#   Protector at its feet stops them: the Sage keeps one under it, everyone stands
#   on it, and nobody wastes SP on ground spells of their own that it would erase.
#   Its summons (Khalitzburg, Mimic, Arclouse) come whenever someone casts at it or
#   shoots it, and with Land Protector down they did nearly all the damage. So only the
#   casters and archers take the summons first, and nobody begins a cast at Amon Ra
#   itself (Lex Aeterna). Holding them idle while none were up (tried) was worse:
#   fewer hands when the next wave came.
#   It is Earth: fire hurts it most (the Wizard's bolt list picks that by itself).
#   It cannot walk (AI 10). Before the engine's Reach asked rAthena's own rude-attack
#   question, companion-roles held every caster and archer still against it.
#
# Results (8 companions at 99, attrition fights, BOSSES.md): without this plan 5.9 % of
# its HP a minute and 16.5 falls a minute; with it 11.9 % and 7.1. Still a ten-minute
# fight: Meteor Storm off the Land Protector's edge and the summons do the damage
# (NEEDS.md 11).

Header:
  Type: POPULATION_STRATEGY_DB
  Version: 1

Body:
  - Mob: AMON_RA
    Encounter: true
    Jobs:
      - Job: All
        # Land Protector erases these, the party's own included.
        Ban: [WZ_METEOR, WZ_STORMGUST, WZ_VERMILION, WZ_HEAVENDRIVE, MG_FIREWALL, WZ_FIREPILLAR,
              WZ_QUAGMIRE, PR_SANCTUARY, PR_MAGNUS, MG_SAFETYWALL, AL_PNEUMA,
              PR_LEXAETERNA]          # a cast begun at it calls its summons
        Rules:
          - Name: ar_lp_incoming     # the Sage is still casting: go where it will land
            Priority: 86
            On: { Event: casts, By: party, Skill: SA_LANDPROTECTOR }
            MoveTo: event_cell
          # Into its middle 5x5: rAthena's official Land Protector (land_protector_behavior
          # 0) blocks a Meteor that lands on it, but one landing outside still hits whoever
          # stands on its edge. On the edge, Meteor Storm and Fire Pillar still did 62 % of
          # the damage.
          - Name: ar_into_lp
            Priority: 86
            MoveTo: { Field: SA_LANDPROTECTOR, Owner: party, Within: 10, Depth: 3 }
      - Job: Sage
        Rules:
          # Land Protector reaches only 2 cells and Amon Ra cannot come to the Sage, so the
          # Sage walks in, to where it could hit back (3 cells), and lays it at its own feet:
          # level 5 covers 11x11, Amon Ra and the party around it. (Walking in to 1-2 cells
          # and laying it at Amon Ra's feet was tried and was worse: 6 % of its HP a minute
          # instead of 12, Meteor Storm back to 37 % of the damage.)
          - Name: ar_lp_here
            Priority: 93
            Cast: SA_LANDPROTECTOR
            Target: self
            Count: { Enemy: boss, Range: 3, AtLeast: 1 }
            Field: { Skill: SA_LANDPROTECTOR, Owner: party, Range: 2, Below: 1 }
            Cooldown: 3000
            Say: "Land Protector here, everyone on!"
          # (By distance: `Reach: false` asks whether it would teleport for the hit, and
          # Amon Ra does that only when idle, so in a fight the Sage never walked in.)
          - Name: ar_lp_walk_in
            Priority: 92
            Target: { Enemy: boss, Range: 14 }
            Field: { Skill: SA_LANDPROTECTOR, Owner: party, At: target, Range: 2, Below: 1 }
            KeepDistance: { Min: 1, Max: 3 }
      - Job: [Wizard, Sage, Hunter]
        Rules:
          - Name: ar_summons_first
            Priority: 84
            Target: { Enemy: slaves }
            SetTarget: true
